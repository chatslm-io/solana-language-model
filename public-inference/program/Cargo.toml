[package]
name = "slm-public-inference"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "lib"]
[dependencies]
solana-program = "=2.3.0"
slm-public-kernel = { path = "../kernel", default-features = false }
[features]
no-entrypoint = []
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
